<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GodotCascade table reference</title>
  <style>
    * { box-sizing:border-box; }
    :root { color-scheme:dark; font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:#0a0f19; color:#d9e2f2; }
    body { width:960px; height:540px; margin:0; overflow:hidden; background:#0a0f19; }
    .leaderboard-page { min-height:540px; padding:30px 48px; display:flex; flex-direction:column; gap:18px; background:#0a0f19; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .leaderboard-heading { display:flex; flex-direction:column; gap:5px; }
    .eyebrow { margin:0; color:#7aa7ff; font-size:11px; }
    .title-row { display:flex; align-items:center; gap:14px; }
    h1 { margin:0; flex:1; color:#f2f5fb; font-size:30px; font-weight:400; }
    .subtitle { margin:0; color:#8d9bb5; font-size:14px; }
    .live-pill { min-width:108px; padding:6px 10px; background:#132b26; border:1px solid #286452; border-radius:99px; color:#75e0b4; font-size:10px; text-align:center; white-space:nowrap; }
    .table-shell { flex:1; overflow:hidden; border:1px solid #2b3b57; border-radius:12px; background:#101827; }
    table { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; }
    col.drag { width:40px; } col.rank { width:54px; } col.pilot { width:auto; } col.division { width:130px; } col.wins { width:58px; } col.rating { width:76px; } col.action { width:88px; }
    th { height:38px; padding:9px 12px; color:#8fa3c4; font-size:11px; font-weight:400; text-align:left; background:#172237; border:0; border-bottom:1px solid #2b3b57; }
    td { height:44px; padding:10px 12px; color:#d9e2f2; font-size:14px; border:0; border-right:1px solid #22314b; border-bottom:1px solid #22314b; }
    td:last-child { border-right:0; } tbody tr:last-child td { border-bottom:0; }
    tbody tr.drag-over td { background:#172a46; }
    .drag-cell,.action-cell { padding:5px; text-align:center; }
    .drag-handle,.remove-pilot { min-width:28px; min-height:32px; padding:4px 7px; color:#8fa3c4; background:#101827; border:1px solid #314361; border-radius:6px; font:inherit; cursor:grab; }
    .drag-handle:active { cursor:grabbing; }
    .remove-pilot { min-width:76px; color:#f2b8b5; background:#24171d; border-color:#66313c; cursor:pointer; }
    .remove-pilot:hover { background:#382029; }
    .leaderboard-footer { display:flex; align-items:center; gap:16px; }
    .status { flex:1; margin:0; color:#7f91af; font-size:13px; }
    .footer-action { min-width:122px; min-height:38px; padding:8px 14px; color:#fff; background:#1c64d1; border:1px solid #5aa7ff; border-radius:8px; font:inherit; cursor:pointer; }
    .footer-action:hover { background:#2878e5; } .footer-action:active { background:#174fa5; }
    .footer-action.secondary { color:#c8d8f5; background:#142037; border-color:#3b557e; }
    .footer-action.secondary:hover { background:#1b2c49; }
  </style>
</head>
<body>
  <main class="leaderboard-page">
    <header class="leaderboard-heading">
      <p class="eyebrow">SEASON 12 · COMPETITIVE</p>
      <div class="title-row"><h1>Flight leaderboard</h1><span class="live-pill">LIVE STANDINGS</span></div>
      <p class="subtitle">Add, remove, sort, or drag pilots while keyed rows reconcile in place.</p>
    </header>
    <div class="table-shell">
      <table aria-label="Flight leaderboard">
        <colgroup><col class="drag"><col class="rank"><col class="pilot"><col class="division"><col class="wins"><col class="rating"><col class="action"></colgroup>
        <thead><tr><th scope="col"><span class="sr-only">Reorder</span></th><th scope="col">Rank</th><th scope="col">Pilot</th><th scope="col">Division</th><th scope="col">Wins</th><th scope="col">Rating</th><th scope="col">Action</th></tr></thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>
    <footer class="leaderboard-footer"><p class="status" id="status" aria-live="polite">Season 12 · five ranked pilots</p><button class="footer-action secondary" id="sort-rating">Sort by rating</button><button class="footer-action" id="add-pilot">Add pilot</button></footer>
  </main>
  <script>
    const entries = [
      {id:'rhea',pilot:'Rhea Sol',division:'Orion',wins:18,rating:2480},
      {id:'milo',pilot:'Milo Vance',division:'Aurora',wins:16,rating:2395},
      {id:'sana',pilot:'Sana Keene',division:'Orion',wins:15,rating:2310},
      {id:'tomas',pilot:'Tomas Reed',division:'Vanguard',wins:13,rating:2190},
      {id:'imani',pilot:'Imani Vale',division:'Aurora',wins:12,rating:2115}
    ];
    const newPilots = [
      ['nia','Nia Ward','Vanguard',11,2075],
      ['oren','Oren Pike','Orion',10,2010],
      ['luz','Luz Hale','Aurora',9,1960]
    ];
    const body = document.querySelector('#leaderboard-body');
    const status = document.querySelector('#status');
    let nextPilot = 0;
    let draggedId = null;

    function renderRows() {
      body.replaceChildren(...entries.map((entry,index) => {
        const row = document.createElement('tr');
        row.dataset.id = entry.id;
        row.innerHTML = `<td class="drag-cell"><button class="drag-handle" draggable="true" aria-label="Drag ${entry.pilot} to reorder">↕</button></td><td>${index+1}</td><td>${entry.pilot}</td><td>${entry.division}</td><td>${entry.wins}</td><td>${entry.rating}</td><td class="action-cell"><button class="remove-pilot" aria-label="Remove ${entry.pilot}">Remove</button></td>`;
        const handle = row.querySelector('.drag-handle');
        handle.addEventListener('dragstart', event => {
          draggedId = entry.id;
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', entry.id);
        });
        handle.addEventListener('dragend', () => {
          draggedId = null;
          document.querySelectorAll('.drag-over').forEach(item => item.classList.remove('drag-over'));
        });
        row.addEventListener('dragover', event => {
          if (!draggedId || draggedId === entry.id) return;
          event.preventDefault();
          row.classList.add('drag-over');
        });
        row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
        row.addEventListener('drop', event => {
          event.preventDefault();
          const sourceIndex = entries.findIndex(item => item.id === draggedId);
          let targetIndex = entries.findIndex(item => item.id === entry.id);
          if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) return;
          const [moved] = entries.splice(sourceIndex,1);
          if (sourceIndex < targetIndex) targetIndex--;
          entries.splice(targetIndex,0,moved);
          status.textContent = `Moved ${moved.pilot} · standings manually reordered`;
          renderRows();
        });
        row.querySelector('.remove-pilot').addEventListener('click', () => {
          entries.splice(entries.findIndex(item => item.id === entry.id),1);
          status.textContent = `Removed ${entry.pilot} · ${entries.length} pilots remain`;
          renderRows();
        });
        return row;
      }));
    }

    document.querySelector('#sort-rating').addEventListener('click', () => {
      entries.sort((a,b) => b.rating-a.rating);
      status.textContent = 'Sorted by rating · highest first';
      renderRows();
    });
    document.querySelector('#add-pilot').addEventListener('click', () => {
      if (entries.length >= 6) {
        status.textContent = 'Table holds six pilots · remove one to add another';
        return;
      }
      const template = newPilots[nextPilot % newPilots.length];
      const cycle = Math.floor(nextPilot / newPilots.length);
      nextPilot++;
      const suffix = cycle ? ` ${cycle+1}` : '';
      entries.push({id:`${template[0]}-${nextPilot}`,pilot:template[1]+suffix,division:template[2],wins:template[3],rating:template[4]});
      status.textContent = `Added ${template[1]+suffix} · drag a handle to reorder`;
      renderRows();
    });
    renderRows();
  </script>
</body>
</html>
