<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GodotCascade — cascading windows size study</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px; color: #e8eefc; background: #0b1220; }
    main { width: min(1080px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 28px; color: #a8b3cc; }
    .surface { margin-bottom: 20px; padding: 28px; border: 1px solid #344054; border-radius: 16px; }
    .dark { background: #111827; }
    .light { color: #0b1220; background: #f7f9fc; }
    .surface h2 { margin: 0 0 24px; font-size: 16px; }
    .sizes { display: flex; align-items: end; gap: 32px; flex-wrap: wrap; }
    figure { margin: 0; text-align: center; }
    figure div { display: grid; place-items: center; min-width: 144px; height: 144px; }
    img { display: block; }
    figcaption { margin-top: 10px; color: #8d9bb5; font: 12px/1.4 ui-monospace, monospace; }
    .light figcaption { color: #475467; }
    .context { display: flex; align-items: center; gap: 14px; margin-top: 28px; padding: 14px 18px; border-radius: 10px; background: #131b2a; }
    .context img { width: 32px; height: 32px; }
    .context strong { display: block; font-size: 14px; }
    .context span { color: #8d9bb5; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Cascading native windows</h1>
    <p>One SVG rendered at its practical shipping sizes. The 128 px mark is the Asset Library target; 16 px is only a stress test.</p>

    <section class="surface dark">
      <h2>Dark surface</h2>
      <div class="sizes">
        <figure><div><img src="godot-cascade-mark.svg" width="128" height="128" alt="GodotCascade mark at 128 pixels"></div><figcaption>128 px</figcaption></figure>
        <figure><div><img src="godot-cascade-mark.svg" width="64" height="64" alt="GodotCascade mark at 64 pixels"></div><figcaption>64 px</figcaption></figure>
        <figure><div><img src="godot-cascade-mark.svg" width="32" height="32" alt="GodotCascade mark at 32 pixels"></div><figcaption>32 px</figcaption></figure>
        <figure><div><img src="godot-cascade-mark.svg" width="16" height="16" alt="GodotCascade mark at 16 pixels"></div><figcaption>16 px</figcaption></figure>
      </div>
      <div class="context"><img src="godot-cascade-mark.svg" alt=""><div><strong>GodotCascade</strong><span>Declarative native UI for Godot</span></div></div>
    </section>

    <section class="surface light">
      <h2>Light surface</h2>
      <div class="sizes">
        <figure><div><img src="godot-cascade-mark.svg" width="128" height="128" alt="GodotCascade mark at 128 pixels"></div><figcaption>128 px</figcaption></figure>
        <figure><div><img src="godot-cascade-mark.svg" width="64" height="64" alt="GodotCascade mark at 64 pixels"></div><figcaption>64 px</figcaption></figure>
        <figure><div><img src="godot-cascade-mark.svg" width="32" height="32" alt="GodotCascade mark at 32 pixels"></div><figcaption>32 px</figcaption></figure>
        <figure><div><img src="godot-cascade-mark.svg" width="16" height="16" alt="GodotCascade mark at 16 pixels"></div><figcaption>16 px</figcaption></figure>
      </div>
    </section>
  </main>
</body>
</html>
