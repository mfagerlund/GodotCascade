<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual inventory</title>
<style>
*{box-sizing:border-box}body{margin:0;width:960px;height:540px;overflow:hidden;background:linear-gradient(125deg,#0b1220,#111c30);color:#e8efff;font-family:Inter,system-ui,sans-serif}.screen{height:100%;padding:28px 34px;display:flex;flex-direction:column;gap:14px}.heading{display:flex;justify-content:space-between;align-items:center}.eyebrow{margin:0;color:#63d6b4;font-size:12px}.title{margin:3px 0;font-size:30px}.subtitle{margin:0;color:#9fb0cb;font-size:14px}.count-pill{padding:8px 13px;border:1px solid #2b876e;border-radius:14px;background:#102d2a;color:#7ff0cf;font-size:12px}.toolbar{display:flex;gap:8px}.toolbar button{padding:7px 12px;border:1px solid #3c5277;border-radius:7px;background:#16243a;color:#dce8ff}.toolbar button:hover{background:#223654}.status{margin:0;color:#8fc4ff;font-size:13px}.viewport{height:356px;overflow:auto;border:1px solid #2c3e5d;border-radius:10px;background:#0a101c}.table{width:100%;border-collapse:collapse;table-layout:fixed}.table th,.table td{height:36px;padding:8px 12px;border-bottom:1px solid #1e2c43;text-align:left;font-size:13px}.table th{position:sticky;top:0;z-index:2;background:#15233a;color:#8fa4c4;font-size:12px}.table th:nth-child(2){width:180px}.table th:nth-child(3){width:150px}.table tr.data:hover{background:#12243a}.spacer td{padding:0;border:0}
</style>
</head>
<body><main class="screen">
<header class="heading"><div><p class="eyebrow">SCALE LAB · FIXED EXTENT</p><h1 class="title">Virtual inventory</h1><p class="subtitle">A 10,000-item model backed by a bounded native Control window.</p></div><span class="count-pill" id="count">10,000 MODEL ITEMS</span></header>
<nav class="toolbar"><button data-jump="0">Jump to top</button><button data-jump="180000">Jump to 5,000</button><button data-jump="end">Jump to end</button><button id="insert">Insert record</button><button id="remove">Remove first</button></nav>
<p class="status" id="status">10,000 records · bounded native virtual window</p>
<div class="viewport" id="viewport"><table class="table" aria-label="Virtual inventory table"><thead><tr><th>Record</th><th>Category</th><th>Value</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><script>
const categories=['Navigation','Reactor','Medical','Survey'];let items=Array.from({length:10000},(_,i)=>({id:`record-${String(i).padStart(5,'0')}`,name:`Cargo record ${String(i).padStart(5,'0')}`,category:categories[i%4],value:`${1200+(i*73)%88000} cr`}));const viewport=document.querySelector('#viewport'),rows=document.querySelector('#rows'),status=document.querySelector('#status'),count=document.querySelector('#count'),height=36,overscan=4;function render(){const first=Math.max(0,Math.floor(viewport.scrollTop/height)-overscan),last=Math.min(items.length,Math.ceil((viewport.scrollTop+viewport.clientHeight)/height)+overscan);rows.innerHTML=`<tr class="spacer"><td colspan="3" style="height:${first*height}px"></td></tr>`+items.slice(first,last).map(item=>`<tr class="data"><td>${item.name}</td><td>${item.category}</td><td>${item.value}</td></tr>`).join('')+`<tr class="spacer"><td colspan="3" style="height:${(items.length-last)*height}px"></td></tr>`}viewport.addEventListener('scroll',render);document.querySelectorAll('[data-jump]').forEach(button=>button.addEventListener('click',()=>{viewport.scrollTop=button.dataset.jump==='end'?viewport.scrollHeight:Number(button.dataset.jump);status.textContent=button.textContent+' · only the visible window is materialized';render()}));document.querySelector('#insert').addEventListener('click',()=>{items.unshift({id:`inserted-${Date.now()}`,name:'Priority cargo',category:'Inserted',value:'99,000 cr'});count.textContent=`${items.length.toLocaleString()} MODEL ITEMS`;status.textContent='Inserted one keyed record · visible anchor preserved';render()});document.querySelector('#remove').addEventListener('click',()=>{items.shift();count.textContent=`${items.length.toLocaleString()} MODEL ITEMS`;status.textContent='Removed the first record · visible anchor preserved';render()});render();
</script></body></html>
