name: Verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "4.7-stable"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Godot
        shell: bash
        run: |
          archive="Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          curl --fail --location --retry 3 "${base}/${archive}" --output "${archive}"
          curl --fail --location --retry 3 "${base}/SHA512-SUMS.txt" --output SHA512-SUMS.txt
          grep "  ${archive}$" SHA512-SUMS.txt | sha512sum --check
          unzip -q "${archive}"
          chmod +x "Godot_v${GODOT_RELEASE}_linux.x86_64"
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" "${RUNNER_TEMP}/godot"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Verify repository files
        run: python tools/ci/verify_repo.py

      - name: Verify generated showcase
        run: python tools/showcase/generate_showcase.py --check

      - name: Scan editor imports
        run: godot --headless --editor --path . --quit-after 3

      - name: Run headless suites
        shell: bash
        run: |
          godot --headless --path . --script res://tests/flex_layout_engine_test.gd
          godot --headless --path . --script res://tests/layout_smoke_test.gd
          godot --headless --path . --script res://tests/component_test.gd
          godot --headless --path . --script res://tests/source_pipeline_test.gd

      - name: Run performance gate
        run: godot --headless --path . --script res://benchmarks/pipeline_benchmark.gd

      - name: Package addon
        run: python tools/release/package_addon.py

      - name: Smoke-test clean installation
        run: python tools/release/clean_install_smoke.py --godot godot

      - name: Upload addon artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-cascade-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          test -f "${notes}"
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.sha256 \
            --title "GodotCascade ${GITHUB_REF_NAME}" \
            --notes-file "${notes}" \
            --verify-tag
