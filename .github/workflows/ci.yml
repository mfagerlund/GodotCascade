name: Verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "4.7.1-stable"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install Godot
        shell: bash
        run: |
          archive="Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          curl --fail --location --retry 3 "${base}/${archive}" --output "${archive}"
          curl --fail --location --retry 3 "${base}/SHA512-SUMS.txt" --output SHA512-SUMS.txt
          grep "  ${archive}$" SHA512-SUMS.txt | sha512sum --check
          unzip -q "${archive}"
          chmod +x "Godot_v${GODOT_RELEASE}_linux.x86_64"
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" "${RUNNER_TEMP}/godot"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Verify repository files
        run: python tools/ci/verify_repo.py

      - name: Verify generated showcase
        run: python tools/showcase/generate_showcase.py --check

      - name: Verify platform-certification tooling
        run: python -m unittest discover -s tools/platform -p "test_*.py"

      - name: Scan editor imports
        run: godot --headless --path . --import

      - name: Run headless suites
        shell: bash
        run: |
          godot --headless --path . --script res://tests/flex_layout_engine_test.gd
          godot --headless --path . --script res://tests/layout_smoke_test.gd
          godot --headless --path . --script res://tests/component_test.gd
          godot --headless --path . --script res://tests/source_pipeline_test.gd
          godot --headless --path . --script res://tests/showcase_app_test.gd
          godot --headless --path . --script res://tests/language_service_test.gd
          godot --headless --path . --script res://tests/editor_tooling_smoke_test.gd
          godot --headless --path . --script res://tests/item_model_test.gd
          godot --headless --path . --script res://tests/collection_scaling_test.gd
          godot --headless --path . --script res://tests/virtualization_test.gd
          godot --headless --path . --script res://tests/platform_certification_test.gd

      - name: Compile generated C# binding example
        run: dotnet build tests/codegen_compile/CodegenCompile.csproj --configuration Release

      - name: Verify VS Code language extension
        working-directory: editors/vscode
        run: npm run check

      - name: Run performance gate
        shell: bash
        run: |
          godot --headless --path . --script res://benchmarks/pipeline_benchmark.gd
          godot --headless --path . --script res://benchmarks/workload_benchmark.gd

      - name: Package addon
        run: python tools/release/package_addon.py

      - name: Smoke-test clean installation
        run: python tools/release/clean_install_smoke.py --godot godot

      - name: Upload addon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: godot-cascade-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  platform-smoke:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Godot 4.7 minimum · Linux
            os: ubuntu-24.04
            release: 4.7-stable
            platform: linux
          - name: Godot 4.7.1 · Windows
            os: windows-2025
            release: 4.7.1-stable
            platform: windows
          - name: Godot 4.7.1 · macOS
            os: macos-15
            release: 4.7.1-stable
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Godot on Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          archive="Godot_v${RELEASE}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${RELEASE}"
          curl --fail --location --retry 3 "${base}/${archive}" --output "${archive}"
          curl --fail --location --retry 3 "${base}/SHA512-SUMS.txt" --output SHA512-SUMS.txt
          grep "  ${archive}$" SHA512-SUMS.txt | sha512sum --check
          unzip -q "${archive}"
          chmod +x "Godot_v${RELEASE}_linux.x86_64"
          mv "Godot_v${RELEASE}_linux.x86_64" "${RUNNER_TEMP}/godot"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Install Godot on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          $archive = "Godot_v$env:RELEASE`_win64.exe.zip"
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:RELEASE"
          Invoke-WebRequest -Uri "$base/$archive" -OutFile $archive
          Invoke-WebRequest -Uri "$base/SHA512-SUMS.txt" -OutFile SHA512-SUMS.txt
          $expected = ((Get-Content SHA512-SUMS.txt | Where-Object { $_ -match "  $([regex]::Escape($archive))$" }) -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA512 $archive).Hash.ToLowerInvariant()
          if (-not $expected -or $actual -ne $expected.ToLowerInvariant()) { throw "SHA-512 mismatch for $archive" }
          Expand-Archive -LiteralPath $archive -DestinationPath godot-dist
          # The console wrapper validates its companion executable's original
          # name. Use the main binary directly for --headless after renaming.
          Move-Item -LiteralPath "godot-dist/Godot_v$env:RELEASE`_win64.exe" -Destination "$env:RUNNER_TEMP/godot.exe"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $env:RUNNER_TEMP

      - name: Install Godot on macOS
        if: matrix.platform == 'macos'
        shell: bash
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          archive="Godot_v${RELEASE}_macos.universal.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${RELEASE}"
          curl --fail --location --retry 3 "${base}/${archive}" --output "${archive}"
          curl --fail --location --retry 3 "${base}/SHA512-SUMS.txt" --output SHA512-SUMS.txt
          grep "  ${archive}$" SHA512-SUMS.txt | shasum -a 512 --check
          unzip -q "${archive}" -d "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/Godot.app/Contents/MacOS/Godot"
          ln -s "${RUNNER_TEMP}/Godot.app/Contents/MacOS/Godot" "${RUNNER_TEMP}/godot"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Run cross-platform runtime smoke
        shell: bash
        run: |
          godot --version
          godot --headless --path . --import
          godot --headless --path . --script res://tests/source_pipeline_test.gd
          godot --headless --path . --script res://tests/item_model_test.gd
          godot --headless --path . --script res://tests/collection_scaling_test.gd
          godot --headless --path . --script res://tests/virtualization_test.gd
          godot --headless --path . --script res://tests/editor_tooling_smoke_test.gd
          godot --headless --path . --script res://tests/platform_certification_test.gd

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, platform-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download verified addon artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: godot-cascade-${{ github.sha }}
          path: dist

      - name: Verify release checksum
        shell: bash
        run: cd dist && sha256sum --check *.sha256

      - name: Verify tagged version consistency
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          plugin_version="$(sed -n 's/^version="\([^"]*\)"$/\1/p' addons/godot_cascade/plugin.cfg)"
          test -n "${plugin_version}"
          test "${version}" = "${plugin_version}"
          test -f "dist/godot-cascade-${version}.zip"
          test -f "dist/godot-cascade-${version}.zip.sha256"

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          test -f "${notes}"
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.sha256 \
            --title "GodotCascade ${GITHUB_REF_NAME}" \
            --notes-file "${notes}" \
            --verify-tag
